[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "arrowtiles"
version = "0.1.0"
description = "DuckDB + Rust (PyO3) ArrowTiles v0.1 builder, reader, and validator"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "pmtiles>=3.4.0",
    "pyarrow>=16.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
arrowtiles = "arrowtiles.__main__:main"

[tool.maturin]
manifest-path = "arrowtiles-engine/Cargo.toml"
python-packages = ["arrowtiles"]
module-name = "arrowtiles._core"
