[package]
name = "arrowtiles_core"
version = "0.1.0"
edition = "2021"
authors = ["Kai Erlenbusch <erlenbusch@uchicago.edu>"]
license = "Apache-2.0"
description = "Rust PyO3 bucketing and Zstd PMTiles packing core for ArrowTiles v0.1"
homepage = "https://github.com/kai-erlenbusch/arrowtiles"
repository = "https://github.com/kai-erlenbusch/arrowtiles"

[lib]
name = "arrowtiles_core"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "58.0.0", features = ["ffi"] }
pyo3 = { version = "0.23.0", features = ["extension-module", "abi3-py39"] }
pyo3-log = "*"
fast_hilbert = "2.1.0"
parquet = "58.0.0"
pmtiles = { version = "0.23.0", default-features = false, features = ["write", "zstd"] }
serde_json = "1.0"
base64 = "0.22"
rayon = "1.10"
log = "0.4"
anyhow = "1.0.103"
zstd = "0.13"
